<style>

.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:8px}.cd{padding:6px 0;border-radius:10px;font-size:13px;cursor:pointer}.cd.sel{background:var(--ac);color:#fff}.cd.t{border:1px solid var(--ac)}.dots{height:6px;display:flex;gap:2px;justify-content:center;margin-top:2px}.dots i{width:5px;height:5px;border-radius:50%}

var K='famapp1',tab='home',S=load();
function load(){var d={meds:[],sales:[],tx:[],paid:[],pct:10,tpl:[],last:{}};try{var r=localStorage.getItem(K);if(!r&&window.Android&&Android.loadData)r=Android.loadData()||null;if(r){var o=JSON.parse(r);for(var k in d)if(o[k]==null)o[k]=d[k];o.meds.forEach(function(m){if(!m.rx)m.rx=(m.first||m.exp)?[{id:Math.random().toString(36).slice(2,9),from:m.first||'',to:m.exp||''}]:[]});return o}}catch(e){}return d}

function addD(x,n){var p=x.split('-').map(Number);return iso(new Date(p[0],p[1]-1,p[2]+n))}
function addM3(x,n){var p=x.split('-').map(Number),t=new Date(p[0],p[1]-1+(n||3),1);t.setDate(Math.min(p[2],new Date(t.getFullYear(),t.getMonth()+1,0).getDate()));return iso(t)}
function nextStep(d,adv){var p=d.split('-').map(Number),t=new Date(p[0],p[1],1),dm=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(),dy=p[2]-adv;if(dy>dm)dy=dm;return iso(new Date(t.getFullYear(),t.getMonth(),dy))}
function plan(m){var rx=(m.rx||[]).filter(function(r){return r.from}).sort(function(a,b){return a.from<b.from?-1:1}),adv=m.adv==null?2:m.adv,o=[],cur=null,ov=m.ov||{};
 rx.forEach(function(r){var st=r.from,w=false;if(cur){var nx=nextStep(cur,adv);if(nx>=st)st=nx;else w=true}
  for(var k=0;k<(r.months||3);k++){var f=ov[o.length];if(f)st=f;o.push({d:st,wait:w&&!f&&k===0,ov:!!f});cur=st;st=nextStep(st,adv);w=false}});return o}

function syncSale(s){S.tx=S.tx.filter(function(t){return t.src!==s.id});
 if(s.paid)S.tx.push({id:uid(),type:'in',amt:s.qty*s.price,desc:'מכירה: '+s.item+' ×'+s.qty+(s.buyer?' ('+s.buyer+')':''),cat:'מכירות',date:s.date,src:s.id})}
function bars(list){var o={},mx=0;list.forEach(function(t){o[t.cat||'אחר']=(o[t.cat||'אחר']||0)+t.amt});for(var k in o)mx=Math.max(mx,o[k]);
 return Object.keys(o).sort(function(a,b){return o[b]-o[a]}).map(function(k){return '<div style="margin-top:6px"><div class="row sp"><span>'+esc(k)+'</span><b>'+fmt(o[k])+'</b></div><div class="bar" style="width:'+Math.round(o[k]/mx*100)+'%"></div></div>'}).join('')||'<div class="mut">אין נתונים</div>'}

var AMT=/(?:₪\s*(\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?))|(?:(\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)\s*(?:₪|ש"ח|ש״ח|שח|ILS|NIS))/,PAYW=/חויבת|חיוב|עסקה|תשלום|רכישה|שילמת|שולם|בוצע|payment|paid|charged|purchase/i,SKIPW=/זיכוי|החזר|קיבלת|התקבל|refund|received/i,MERW=/(?:בבית העסק|בבית עסק|אצל|ב-)\s*([^,.\d₪\n]{2,30})/;
var SAMPLES=['שילמת ₪45.90 ב-שופרסל דיל באמצעות Google Wallet','חויבת בסך 120.00 ש"ח בבית עסק סופר פארם','התשלום בסך ₪80 בוצע בהצלחה','קיבלת זיכוי של ₪50 מהחנות','היי, נפגשים ב-8?'];

 var m=AMT.exec(t);if(!m)return{ok:false,why:'לא נמצא סכום ב-₪'};var a=parseFloat((m[1]||m[2]).replace(/,/g,'')),mm=MERW.exec(t);return{ok:true,a:a,mer:mm?mm[1].split(/\s+(?:באמצעות|בכרטיס|דרך|בסך)\s*/)[0].trim():''}}
function testCard(){var r=testRes,h='<div class="card"><b>🧪 בדיקת זיהוי הוצאה</b><div class="mut m8">הדבק טקסט של התראה או SMS ותראה מה האפליקציה הייתה מזהה.</div><label class="f m8">טקסט ההתראה<textarea id="tt" rows="3" style="font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px">'+esc(testTxt)+'</textarea></label><div class="row m8"><button data-a="tdet">זהה</button><button class="g" data-a="tex">דוגמה</button></div>';
 if(r){if(!r.ok)h+='<div class="m8 bad">לא זוהה כהוצאה: '+r.why+'</div>';else h+='<div class="card m8" style="border-color:var(--ok)"><b class="ok">✔ זוהתה הוצאה</b><label class="f m8">סכום<input id="ta" type="number" value="'+r.a+'"></label><label class="f m8">על מה ההוצאה?<input id="td" value="'+esc(r.mer)+'"></label><label class="f m8">קטגוריה<select id="tc">'+opts(EXP)+'</select></label><div class="row m8"><button data-a="tsave">שמירה כהוצאה</button><button class="g" data-a="tno">זו לא הוצאה</button></div></div>'}
 return h+'</div>'}
function syncRem(){try{if(window.Android){var o=[];S.meds.forEach(function(m){plan(m).forEach(function(x){if(!isDone(m,x.d))o.push(x.d+'|'+m.name)});var rd=renewDue(m);if(rd)o.push(rd+'|חידוש מרשם: '+m.name)});Android.setReminders(o.join('\n'));Android.setTelegram(TG.token||'',TG.chat||'',!!TG.notif)}}catch(e){}}
function backupCard(){return '<div class="card"><b>⚙️ גיבוי ושחזור</b><div class="mut m8">יוצרים גיבוי, מעתיקים את הטקסט ושומרים אותו (למשל בהודעה לעצמך). לשחזור מדביקים אותו כאן.</div><textarea id="bk" rows="2" onfocus="this.select()" style="font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;margin-top:8px">'+esc(bkTxt)+'</textarea><div class="row m8"><button data-a="bkx">יצירת גיבוי</button><button class="g" data-a="bki">שחזור מהטקסט</button></div>'+(bkMsg?'<div class="m8 '+(bkMsg.indexOf('✔')===0?'ok':'bad')+'">'+bkMsg+'</div>':'')+'</div>'}
var PI={home:'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z',meds:'M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1zM6 6h12v15H6zM9 11h6M9 15h6',sales:'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',fin:'M3 17l6-6 4 4 8-8M15 7h6v6',more:'M5 12h.01M12 12h.01M19 12h.01',plus:'M12 5v14M5 12h14',search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0'};
function ic(n,z){z=z||22;return '<svg width="'+z+'" height="'+z+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+PI[n]+'"/></svg>'}
function pad(n){return String(n).padStart(2,'0')}
function addMo(m,n){var d=new Date(+m.slice(0,4),+m.slice(5)-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}

function optsSel(a,sel){return a.map(function(c){return '<option'+(c===sel?' selected':'')+'>'+c+'</option>'}).join('')}

var KW=[['מזון',/סופר|שופרסל|רמי לוי|מסעדה|קפה|פיצה|מכולת|וולט|מאפה/],['תחבורה',/דלק|פז|סונול|חניה|רכבת|אוטובוס|גט|מונית/],['בריאות',/סופר פארם|בית מרקחת|רופא|קופת חולים|מכבי|כללית/],['דיור',/ארנונה|חשמל|מים|שכר דירה|גז|ועד בית/],['חינוך',/גן|בית ספר|שיעור|חוג/],['קניית סחורה',/סחורה|ספק|מלאי/]];

 due().forEach(function(x){o.push({txt:x.m.name+' · להוציא מרשם ('+fd(x.d)+')',lab:'הוצאתי',a:'pick',i:x.m.id,t:x.d})});

 if(owed()>0)o.push({txt:'מעשר לתשלום: '+fmt(owed()),lab:'למעשרות',a:'goto',t:'maaser'});return o}

addsale:function(){var m=prod(val('sp0')),it=m?m.name:val('si');if(!it)return;var q=num('sq')||1,pr=num('sp');
 var s={id:uid(),pid:m?m.id:'',item:it,qty:q,price:pr,buyer:val('sb'),note:val('sn'),date:today(),paid:$('#spd').checked};if(m)m.stock-=q;S.sales.push(s);syncSale(s);showSale=false},
paid:function(i){var s=S.sales.find(function(x){return x.id===i});s.paid=!s.paid;syncSale(s)},
delsale:function(i){var s=S.sales.find(function(x){return x.id===i}),m=s&&s.pid?prod(s.pid):null;if(m)m.stock+=s.qty;S.sales=S.sales.filter(function(x){return x.id!==i});S.tx=S.tx.filter(function(t){return t.src!==i})},
addtx:function(){var a=num('fa');if(!a)return;var t=val('ft');S.tx.push({id:uid(),type:t,amt:a,desc:val('fdc'),cat:val('fc'),date:val('fdt')||today(),noM:t==='in'&&!$('#fnm').checked})},
deltx:function(i){S.tx=S.tx.filter(function(t){return t.id!==i})},
paym:function(){var a=num('mp');if(a>0){var id=uid();S.paid.push({id:id,amt:a,date:today()});S.tx.push({id:uid(),type:'out',amt:a,desc:'תשלום מעשר',cat:'מעשר',date:today(),src:'p'+id})}},
delpaid:function(i){S.paid=S.paid.filter(function(x){return x.id!==i});S.tx=S.tx.filter(function(t){return t.src!=='p'+i})},
setpct:function(){var p=num('pc');if(p>0&&p<=100)S.pct=p}
};
var DEL={deltx:1,delsale:1,delmed:1,delpaid:1,delrx:1},TOAST={addmed:'המוצר נוסף',addrx:'המרשם נוסף',addsale:'המכירה נרשמה',addtx:'נוסף',paym:'התשלום נרשם',xsave:'נשמר',tpl:'נוסף מתבנית',refill:'המלאי עודכן',reduce:'המלאי עודכן',setpct:'האחוז עודכן',pick:'עודכן',setnote:'ההערה נשמרה',setov:'התאריך עודכן',clrov:'התאריכים אופסו'};
function run(a,i,t){try{if(navigator.vibrate)navigator.vibrate(8)}catch(e){}if(a!=='delmed')confirmDel=null;var pre=JSON.stringify(S),r=A[a](i,t);save();render();if(r===false)return;if(DEL[a]&&pre!==JSON.stringify(S))snack('נמחק',pre);else if(TOAST[a])snack(TOAST[a])}
document.addEventListener('click',function(e){var b=e.target.closest('[data-tab],[data-a]');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;sheet=null;search=false;fresh=true;render();return}
 run(b.dataset.a,b.dataset.i,b.dataset.t)});
document.addEventListener('touchstart',function(e){swEl=e.target.closest('[data-sw]');sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){if(!swEl)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>80&&Math.abs(dy)<40){var a=dx<0?swEl.dataset.swl:swEl.dataset.swr;if(a)run(a,swEl.dataset.i)}swEl=null},{passive:true});
document.addEventListener('input',function(e){var t=e.target;if(t.id==='q')$('#sr').innerHTML=srHtml(t.value);
 if(t.id==='xd'&&sheet==='exp'){KW.forEach(function(k){if(k[1].test(t.value))$('#xc').value=k[0]})}});
document.addEventListener('change',function(e){var t=e.target;
 if(t.id==='sp0'){var m=prod(t.value);if(m&&$('#sp'))$('#sp').value=m.price||'';$('#sow').style.display=m?'none':'flex';updTot()}
 if(t.id==='fm'&&t.value){mon=t.value;S.ui={mon:mon};save();render()}
 if(t.id==='tga'){TG.auto=t.checked;tgSave()}
 if(t.id==='tgn'){TG.notif=t.checked;tgSave();syncRem()}
 if(t.id==='tgcm'){TG.cmds=t.checked;tgSave()}
 if(t.id==='ft')$('#fc').innerHTML=opts(t.value==='in'?INC:EXP)});
document.addEventListener('input',function(e){if(e.target.id==='sq'||e.target.id==='sp')updTot()});
try{if(window.Android&&Android.saveData)Android.saveData(JSON.stringify(S))}catch(e){}
setInterval(tgPoll,15000);setTimeout(tgPoll,1500);
function importPending(a){try{a.forEach(function(x){S.tx.push({id:uid(),type:'out',amt:x.amt,desc:x.desc,cat:x.cat,date:x.date})});save();render()}catch(e){}}
render();
